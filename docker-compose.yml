# Web + API + PostgreSQL. Bind to localhost; put your reverse proxy (nginx/Caddy) in front for TLS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sports:${POSTGRES_PASSWORD}@db:5432/sports
      APP_ENV: production
    volumes: [uploads:/data/uploads]

  web:
    build:
      context: .
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8090}:3000"]

  # Daily backup of the database and the uploaded files into ./backups. Runs once at start, then every 24 hours.
  # It only ever adds files; clearing out old backups is done by hand (see docs/deploy.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          d=$$(date +%Y%m%d-%H%M)
          pg_dump -h db -U sports sports | gzip > /backups/db-$$d.sql.gz && echo "database backup $$d ok" || echo "database backup $$d FAILED"
          tar -czf /backups/uploads-$$d.tar.gz -C /uploads . && echo "uploads backup $$d ok" || echo "uploads backup $$d FAILED"
          sleep 86400
        done

volumes:
  dbdata:
  uploads:
